<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云平台人力产能工作台</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="sticky-header">
  <header class="topbar">
    <div class="brand">云平台人力产能工作台</div>
    <div class="cycle-label" id="cycleLabel">未设置版本周期</div>
    <div class="mode-badge" id="modeBadge"></div>
    <div class="actions">
      <button id="btnArchive" class="btn archive-btn" title="归档本迭代数据">归档本迭代</button>
      <button id="btnSave" class="btn">保存草稿</button>
      <button id="btnExport" class="btn">导出 JSON</button>
      <label class="btn file">导入 JSON<input type="file" id="fileJson" accept=".json" hidden></label>
      <button id="btnExportXlsx" class="btn primary">导出 Excel</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <nav class="tabs">
    <button class="tab active" data-view="cycle">① 版本周期</button>
    <button class="tab" data-view="headcount">② 人头数填报</button>
    <button class="tab" data-view="locked">③ 专项锁定人力</button>
    <button class="tab" data-view="import">④ 工时数据导入</button>
    <button class="tab" data-view="iteration">⑤ 迭代口径</button>
    <button class="tab" data-view="analysis">⑥ 偏差分析</button>
    <button class="tab" data-view="archiveHistory">⑦ 历史归档</button>
  </nav>
</div>

<main>
  <section class="view" id="view-cycle"></section>
  <section class="view hidden" id="view-headcount"></section>
  <section class="view hidden" id="view-locked"></section>
  <section class="view hidden" id="view-import"></section>
  <section class="view hidden" id="view-iteration"></section>
  <section class="view hidden" id="view-analysis"></section>
  <section class="view hidden" id="view-archiveHistory"></section>
</main>

<div id="archiveBanner" class="archive-banner hidden"></div>

<div id="archiveModal" class="modal-overlay hidden">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="archiveModalTitle">确认归档</h3>
      <button class="modal-close" id="archiveModalClose">&times;</button>
    </div>
    <div class="modal-body" id="archiveModalBody"></div>
    <div class="modal-footer" id="archiveModalFooter"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="calc.js"></script>
<script src="parse.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
