<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云平台管理工作台</title>
<!-- SheetJS：本地同源加载。原先挂在 cdn.jsdelivr.net，内网访问不到时导入/导出会静默失效 -->
<script src="vendor/xlsx.full.min.js?v=0.18.5"></script>
<link rel="stylesheet" href="platform.css?v=20260922b">
<link rel="stylesheet" href="modules/project/project.css?v=20260910a">
<link rel="stylesheet" href="modules/csenergy/csenergy.css?v=20260901b">
<link rel="stylesheet" href="modules/plan/plan.css?v=20260911a">
<link rel="stylesheet" href="modules/inbox/inbox.css?v=20260922a">
</head>
<body>

<!-- Top Navbar (48px) -->
<header class="platform-navbar">
  <div class="navbar-left">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="菜单">☰</button>
    <span class="navbar-brand">云平台管理工作台</span>
  </div>
  <div class="navbar-right">
    <!-- 账号：点姓名出下拉，里面是改口令 / 退出登录。
         2026-09-22 之前全平台没有退出登录入口，而会话 Cookie 有 30 天，
         共用电脑上前一个人登完不登出，后一个人打开就是他的身份。 -->
    <div class="navbar-user-wrap" id="navbarUserWrap">
      <button class="navbar-user-btn" id="navbarUser" title="账号">用户</button>
      <div class="navbar-user-menu hidden" id="navbarUserMenu">
        <a class="navbar-user-item" href="#/dashboard/settings" id="navbarUserAcct">账号与口令</a>
        <button class="navbar-user-item danger" id="navbarLogout">退出登录</button>
      </div>
    </div>
    <button class="navbar-icon" id="navbarNotify" title="通知">🔔</button>
    <button class="navbar-icon" id="navbarSettings" title="设置">⚙</button>
  </div>
</header>

<!-- Layout: Sidebar + Main Content -->
<div class="platform-layout">

  <!-- Sidebar (200px expanded / 56px collapsed / overlay on mobile) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="折叠/展开">☰</button>
      <span class="sidebar-title">云平台</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Navigation items rendered by platform.js -->
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <!-- 数据自动流入：独立整页（自己一套脚本，不进 SPA 路由），新标签打开 -->
      <a class="sidebar-nav-item" href="dataflow.html" target="_blank" rel="noopener" id="sidebarDataflow">
        <span class="nav-icon" data-fixed="dataflow">🔄</span>
        <span class="nav-label">数据自动流入</span>
      </a>
      <a class="sidebar-nav-item" href="#/dashboard/settings" data-module="settings">
        <span class="nav-icon" data-fixed="settings">⚙</span>
        <span class="nav-label">系统设置</span>
      </a>
      <a class="sidebar-nav-item" href="#/help" data-module="help" id="sidebarHelp">
        <span class="nav-icon" data-fixed="help">📖</span>
        <span class="nav-label">使用帮助</span>
      </a>
    </div>
  </aside>

  <!-- Sidebar overlay backdrop (mobile) -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- Main Content Area -->
  <main class="main-content" id="mainContent">
    <!-- 初始口令提示条：批量建号发下去的口令还没改过时显示，点「知道了」可关掉 -->
    <div class="pwd-notice hidden" id="pwdNotice">
      <span class="pwd-notice-icon">🔑</span>
      <span class="pwd-notice-text">
        你还在使用初始口令，同批次同事的口令规则相同，建议尽快改掉。
      </span>
      <a class="pwd-notice-action" href="#/dashboard/settings">去修改口令</a>
      <button class="pwd-notice-close" id="pwdNoticeClose" title="知道了" aria-label="关闭">&times;</button>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb-bar" id="breadcrumbBar"></div>

    <!-- Module Containers (pre-created) -->
    <div id="module-dashboard" class="module-view active"></div>
    <div id="module-iteration" class="module-view hidden"></div>
    <div id="module-project" class="module-view hidden"></div>
  </main>

</div>

<!-- Toast notification -->
<div id="toast" class="toast hidden"></div>

<!-- Modal overlay -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Shared dependencies -->
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="sync.js"></script>

<!-- Platform shell scripts -->
<script src="shared-ui.js"></script>
<script src="router.js"></script>

<!-- Module scripts (loaded before platform.js init) -->
<script src="modules/dashboard/index.js"></script>
<script src="modules/iteration/index.js"></script>
<script src="modules/project/index.js"></script>
<script src="modules/budget/index.js"></script>
<script src="modules/token/index.js"></script>
<script src="modules/settings/index.js"></script>
<script src="modules/csenergy/index.js"></script>
<script src="modules/plan/index.js?v=20260911a"></script>
<script src="modules/inbox/index.js?v=20260922a"></script>

<!-- Platform orchestrator (must be last — calls Platform.init) -->
<script src="platform.js?v=20260909j"></script>

<!-- Initialize platform with all modules -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    Platform.init([DashboardModule, InboxModule, IterationModule, ProjectModule, CsEnergyModule, PlanModule]);
  });
</script>
</body>
</html>
